<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlPlane.ai - Regression Test Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .test-container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; }
        h1 { font-size: 20px; margin-top: 0; }
        .summary { display: flex; gap: 16px; margin-bottom: 20px; }
        .stat { background: #334155; padding: 12px 20px; border-radius: 6px; flex: 1; text-align: center; }
        .stat strong { display: block; font-size: 24px; margin-bottom: 4px; }
        .pass { color: #22c55e; }
        .fail { color: #ef4444; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; }
        .status-pass { color: #22c55e; font-weight: bold; }
        .status-fail { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>ControlPlane.ai Detection Engine Tests</h1>
        <div class="summary" id="test-summary">
            <div class="stat"><strong>Running...</strong> Total Tests</div>
        </div>
        <table id="test-table">
            <thead>
                <tr>
                    <th>Test Case</th>
                    <th>Expected</th>
                    <th>Actual</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="../js/data/scenarios.js"></script>
    <script src="../js/data/corpus.js"></script>
    <script src="../js/grounding.js"></script>
    <script src="../js/detection.js"></script>
    <script src="../js/tier2.js"></script>
    <!-- Basic mock of controlPlane and policies for testing -->
    <script>
        window.controlPlane = {
            policies: {
                cs_bot: { perf_hallucination_warn: 0.2, perf_hallucination_block: 0.6, resp_pii_block: 0.5, gdprEnabled: false },
                int_kb: { perf_hallucination_warn: 0.3, perf_hallucination_block: 0.8, resp_pii_block: 0.8, gdprEnabled: false },
                reg_tool: { perf_hallucination_warn: 0.1, perf_hallucination_block: 0.4, resp_pii_block: 0.1, gdprEnabled: true }
            }
        };
    </script>
    <script src="tests.js"></script>
</body>
</html>
